api_version: aaf.dev/v1alpha1
kind: Agent
metadata:
  name: scrum-master
  display_name: Scrum Master
spec:
  communication:
    language: user-preferred
    style: facilitative
  core_skills:
    - ../../skills/agent-core-skills/scrum-master-core
  skill_catalogs:
    - ../../skills
  permissions:
    product_code:
      read: false
      execute: false
      write: false
    knowledge_artifacts:
      read: true
      write: true
    framework_extensions:
      read: true
      write_via_pull_request: true
    base_framework:
      write: false
    commands:
      run: true
      run_tests: false
    external_services:
      use: true
      production_mutation: false
    git:
      branch: true
      commit: true
      pull_request: true
      force_push: false
      protected_branch_write: false
  subscriptions:
    - sprint.planning-started
    - sprint.impediment
    - scrum.deviation
    - sprint.review-ready
    - retrospective.ready
  task_priority:
    - human.interaction.urgent
    - sprint.impediment
    - scrum.deviation
    - event.facilitation
    - continuous-improvement
